name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: epi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d epi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/epi_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/epi_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Prisma (gerar client e validar schema)
        run: |
          pnpm db:generate
          pnpm db:validate

      - name: Formatacao
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitarios e de componentes
        run: pnpm test

      - name: Testes de integracao da API (PostgreSQL real, migrations versionadas)
        run: pnpm --filter @epi-manager/api test:integration

      - name: Migrations conferem com o schema (sem drift)
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema database/prisma/schema.prisma --exit-code

      - name: Build
        run: pnpm build
