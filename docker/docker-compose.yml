name: epi-manager

services:
  postgres:
    image: postgres:16-alpine
    container_name: epi-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epi_manager
      POSTGRES_PASSWORD: epi_manager
      POSTGRES_DB: epi_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epi_manager -d epi_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
