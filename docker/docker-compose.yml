name: epi-manager

# Ambiente de desenvolvimento: PostgreSQL 16 com dois bancos (dev e testes de integracao).
# Credenciais APENAS para desenvolvimento local.
services:
  postgres:
    image: postgres:16-alpine
    container_name: epi-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epi_manager
      POSTGRES_PASSWORD: epi_manager
      POSTGRES_DB: epi_manager
      LANG: pt_BR.utf8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epi_manager -d epi_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
